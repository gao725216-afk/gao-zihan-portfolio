<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>高梓晗作品集</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* Layout: TT Suite product language, calm. A short intro, then a 3×2 collection of separate project cards (cover + name +
   one line). Clicking a card grows it into a full detail sheet (story, role, live demo, links) with prev / next. */
:root{
  color-scheme:light;
  --paper:#FFFBF5; --surface:#FFFFFF; --sunken:#FBF6EE; --line:#EFE6D8; --line-strong:#E0D4C2; --edge:#E6DACA;
  --ink:#2B2A4C; --ink-2:#5A5878; --ink-3:#8E8BA6; --ink-edge:#17163A;
  --pine:#6C5CE7; --pine-edge:#4B3DBB; --lemon:#FFD43B; --lemon-edge:#E8B90F; --mint:#2DC98A; --mint-soft:#DCF8EA; --mint-ink:#128A5E;
  --m:#6C5CE7; --m-soft:#ECE9FF; --m-ink:#4B3DBB; --m-edge:#4B3DBB; --m-on:#fff;
  --f-round:"Fredoka","Nunito","Noto Sans SC",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --pressed:0 0 0 1.5px var(--line-strong),0 6px 0 var(--edge);
  --spring:cubic-bezier(.34,1.4,.64,1);
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
  background:var(--paper) radial-gradient(circle,rgba(43,42,76,.09) 1.2px,transparent 1.4px) 0 0/22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--paper)}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
p{margin:0}
h1,h2,h3{margin:0;font-family:var(--f-round);font-weight:600}
::selection{background:var(--lemon);color:var(--ink)}
:focus-visible{outline:3px solid var(--pine);outline-offset:3px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
.brand{display:flex;align-items:center;gap:10px;font:600 18px var(--f-round)}
.logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--pine);box-shadow:0 3px 0 var(--pine-edge)}
.logo svg{width:21px;height:21px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;border:0;cursor:pointer;font:800 15px var(--f-body);
  background:var(--ink);color:#fff;box-shadow:0 4px 0 var(--ink-edge);transition:transform .12s,box-shadow .12s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink-edge)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink-edge)}
.btn.m{background:var(--m);color:var(--m-on);box-shadow:0 4px 0 var(--m-edge)}
.btn.m:active{box-shadow:0 0 0 var(--m-edge)}
.btn.w{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-strong),0 4px 0 var(--edge)}
.btn.w:active{box-shadow:inset 0 0 0 1.5px var(--line-strong),0 0 0 var(--edge)}
.btn.sm{height:40px;padding:0 16px;font-size:14px}
.btn svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font:800 12.5px var(--f-body);background:#fff;box-shadow:inset 0 0 0 1.5px var(--line-strong);white-space:nowrap}
.chip.live{background:var(--mint-soft);box-shadow:none;color:var(--mint-ink)}
.chip.live i{width:7px;height:7px;border-radius:50%;background:var(--mint)}

/* intro */
.intro{padding-block:clamp(56px,9vw,110px) clamp(40px,6vw,64px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 40px;align-items:end}
@media (max-width:760px){.intro{grid-template-columns:minmax(0,1fr)}}
.intro h1{font-size:clamp(46px,7.2vw,96px);line-height:1;letter-spacing:-.03em}
.intro h1 .hl{background:linear-gradient(transparent 64%,var(--lemon) 64%);padding:0 .06em;border-radius:6px}
.intro p{margin-top:18px;font:700 clamp(17px,1.6vw,20px)/1.6 var(--f-body);color:var(--ink-2);max-width:26em}
.intro .meta{display:flex;flex-wrap:wrap;gap:8px}

/* collection */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.sec-h h2{font-size:26px}
.sec-h span{font:700 14px var(--f-body);color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;display:flex;flex-direction:column;border:0;padding:0;text-align:left;cursor:pointer;background:var(--surface);border-radius:30px;box-shadow:var(--pressed);
  overflow:hidden;transition:transform .4s var(--spring),box-shadow .3s;font:inherit;color:inherit}
.card:hover{transform:translateY(-6px);box-shadow:0 0 0 1.5px var(--line-strong),0 10px 0 var(--edge),0 26px 40px -24px rgba(43,42,76,.35)}
.card:active{transform:translateY(2px)}
.cover{position:relative;aspect-ratio:4/3.1;background:var(--m-soft);overflow:hidden;isolation:isolate}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle,rgba(255,255,255,.8) 1.3px,transparent 1.5px) 0 0/18px 18px}
.cover>*{transition:transform .5s var(--spring)}
.card:hover .cover>.lift{transform:translateY(-8px) rotate(var(--hr,0deg))}
.card .body{padding:20px 22px 22px;display:grid;gap:8px}
.card .row{display:flex;align-items:center;gap:12px}
.card .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--m);box-shadow:0 3px 0 var(--m-edge);flex:none}
.card .ic svg{width:22px;height:22px}
.card h3{font-size:24px;line-height:1.1}
.card .no{font:800 12px var(--f-body);color:var(--m-ink);display:block}
.card p{font:700 15px/1.55 var(--f-body);color:var(--ink-2)}
.card .more{margin-top:4px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);transition:background .25s,transform .35s var(--spring)}
.card .go svg{width:17px;height:17px}
.card:hover .go{background:var(--m);color:var(--m-on);transform:rotate(-45deg)}

/* cover art */
.shot{position:absolute;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 0 0 1.5px rgba(43,42,76,.1),0 6px 0 rgba(43,42,76,.08),0 22px 34px -20px rgba(43,42,76,.45)}
.shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left}
.ph{position:absolute;padding:6px;border-radius:26px;background:var(--ink);box-shadow:0 5px 0 var(--ink-edge),0 22px 34px -18px rgba(43,42,76,.5)}
.ph img{display:block;width:100%;border-radius:20px}
.c-tt .shot{left:12%;top:16%;width:104%;aspect-ratio:16/10;transform:rotate(-3deg);--hr:-1deg}
.c-or .ph{left:50%;top:12%;width:42%;margin-left:-21%;transform:rotate(-5deg);--hr:-2deg}
.c-cm .ph{left:50%;top:12%;width:40%;margin-left:-20%;transform:rotate(5deg);--hr:2deg}
.mini-feed{position:absolute;left:50%;top:12%;width:40%;margin-left:-20%;padding:6px;border-radius:26px;background:var(--ink);box-shadow:0 5px 0 var(--ink-edge),0 22px 34px -18px rgba(43,42,76,.5);transform:rotate(4deg);--hr:1deg;height:110%;overflow:hidden}
.mini-feed .in{border-radius:20px;overflow:hidden;height:100%;background:#15142B}
.mini-feed .tk{display:grid;gap:5px;padding:5px;animation:feed 14s linear infinite}
@keyframes feed{to{transform:translateY(-50%)}}
.t{height:62px;border-radius:12px}
.t.p{background:linear-gradient(150deg,#FF8A5C,#A88BFF)}.t.p:nth-child(3n){background:linear-gradient(150deg,#FFC83D,#FF6FA5)}.t.p:nth-child(4n){background:linear-gradient(150deg,#4AA8FF,#A88BFF)}
.t.r{background:#24234A;box-shadow:inset 0 0 0 2px var(--mint)}
.c-pku .big{position:absolute;left:0;right:0;top:22%;text-align:center;font:700 clamp(84px,9vw,120px)/1 var(--f-round);color:var(--m);letter-spacing:-.04em}
.c-pku .big .pl{font-size:.5em;vertical-align:.7em}
.c-pku .bar{position:absolute;left:14%;right:14%;bottom:18%;height:12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line-strong);overflow:hidden}
.c-pku .bar i{display:block;height:100%;width:86%;border-radius:inherit;background:var(--m) linear-gradient(90deg,rgba(255,255,255,.3) 0 50%,transparent 50%) 0 0/14px 100%}
.c-res .list{position:absolute;left:14%;right:14%;top:16%;background:#fff;border-radius:20px;padding:10px;box-shadow:0 0 0 1.5px var(--line-strong),0 5px 0 var(--edge);transform:rotate(-3deg);--hr:-1deg;display:grid;gap:6px}
.c-res .list div{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;background:var(--sunken);font:800 13px var(--f-body)}
.c-res .list div i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-strong);flex:none}
.c-res .list div.d{background:var(--m-soft)}
.c-res .list div.d i{background:var(--m);box-shadow:none}
.c-res .list div.d span{text-decoration:line-through;text-decoration-color:var(--m);text-decoration-thickness:2px;color:var(--ink-2)}

footer{padding:28px 0 48px;text-align:center;font:700 13px var(--f-body);color:var(--ink-3)}

/* ---------- detail sheet ---------- */
.ov[hidden]{display:none}
.ov{position:fixed;inset:0;z-index:80;padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.ov .scrim{position:absolute;inset:0;background:rgba(43,42,76,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{position:relative;width:100%;max-width:1180px;height:100%;background:var(--paper);border-radius:32px;box-shadow:0 0 0 1.5px var(--line-strong),0 8px 0 var(--edge),0 40px 80px -30px rgba(23,22,58,.55);overflow:hidden;display:flex;flex-direction:column;transform-origin:0 0}
@media (max-width:760px){.ov{padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0}.sheet{border-radius:28px 28px 0 0}}
.sheet .bar{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1.5px solid var(--line);background:var(--surface)}
.sheet .bar .t{font:600 17px var(--f-round);margin-right:auto;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden}
.sheet .bar .t .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--m);box-shadow:0 2px 0 var(--m-edge);flex:none}
.sheet .bar .t .ic svg{width:17px;height:17px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--sunken);cursor:pointer;color:var(--ink);transition:background .2s}
.iconbtn:hover{background:var(--line)}
.iconbtn svg{width:18px;height:18px}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.d-hero{background:var(--m-soft);position:relative;padding:clamp(28px,4vw,52px) clamp(22px,4vw,52px) clamp(24px,3vw,36px);isolation:isolate}
.d-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle,rgba(255,255,255,.8) 1.3px,transparent 1.5px) 0 0/20px 20px}
.d-hero .no{font:800 13px var(--f-body);color:var(--m-ink)}
.d-hero h2{margin-top:6px;font:700 clamp(46px,7vw,92px)/1 var(--f-round);letter-spacing:-.035em}
.d-hero .lead{margin-top:16px;font:700 clamp(18px,1.8vw,22px)/1.6 var(--f-body);max-width:30em}
.d-hero .chips{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.d-demo{padding:clamp(22px,3vw,36px) clamp(22px,4vw,52px) 0;background:linear-gradient(var(--m-soft) 0 45%,transparent 45%)}
.d-demo .row{display:flex;gap:clamp(16px,2.5vw,30px);align-items:flex-end;justify-content:center}
@media (max-width:860px){.d-demo .row{flex-direction:column;align-items:center}}
.d-demo .acts{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.hint{font:800 13px var(--f-body);color:var(--m-ink);background:var(--m-soft);padding:8px 13px;border-radius:999px}
.d-body{padding:clamp(28px,4vw,48px) clamp(22px,4vw,52px) clamp(36px,5vw,60px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px}
@media (max-width:860px){.d-body{grid-template-columns:minmax(0,1fr)}}
.d-body h3{font:800 12px/1 var(--f-body);letter-spacing:.08em;color:var(--ink-3);margin-bottom:14px}
.did{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.did li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700}
.did li b{width:26px;height:26px;border-radius:9px;background:var(--m);color:var(--m-on);display:grid;place-items:center;font:600 13px var(--f-round);flex:none;margin-top:1px}
.facts{display:grid;gap:10px;align-content:start;margin:0}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:14px 16px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.facts dt{color:var(--ink-3);font-weight:800;font-size:14px;white-space:nowrap}
.facts dd{margin:0;font-weight:800;text-align:right}
.nextbar{display:flex;justify-content:space-between;gap:12px;padding:0 clamp(22px,4vw,52px) 40px}
.nextbar button{flex:1;max-width:320px;display:flex;flex-direction:column;gap:2px;padding:16px 18px;border:0;border-radius:20px;background:#fff;box-shadow:var(--pressed);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .3s var(--spring)}
.nextbar button:hover{transform:translateY(-3px)}
.nextbar button.r{text-align:right;margin-left:auto}
.nextbar small{font:800 12px var(--f-body);color:var(--ink-3)}
.nextbar b{font:600 20px var(--f-round)}

/* devices in detail */
.dev{position:relative;flex:none}
.dev.browser{flex:1 1 auto;min-width:0;width:100%;max-width:880px;border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 0 0 1.5px rgba(43,42,76,.12),0 7px 0 rgba(43,42,76,.08),0 30px 50px -28px rgba(43,42,76,.5)}
.dev .db{height:36px;display:flex;align-items:center;gap:7px;padding:0 14px;background:var(--sunken);border-bottom:1.5px solid var(--line)}
.dev .db i{width:11px;height:11px;border-radius:50%}
.dev .db i:nth-child(1){background:#FF7A7A}.dev .db i:nth-child(2){background:#FFD43B}.dev .db i:nth-child(3){background:#2DC98A}
.dev .db span{margin:0 auto;font:700 12px/1 var(--f-body);color:var(--ink-3);background:#fff;border-radius:999px;padding:7px 16px;box-shadow:inset 0 0 0 1.5px var(--line);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen{position:relative;overflow:hidden;background:#fff}
.dev.browser .screen{aspect-ratio:var(--aw)/var(--ah)}
.screen iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.screen .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;transition:opacity .4s}
.screen.loaded .poster{opacity:0;pointer-events:none}
.dev.phone{width:var(--pw,260px);padding:9px;border-radius:44px;background:var(--ink);box-shadow:0 6px 0 var(--ink-edge),0 30px 50px -24px rgba(43,42,76,.55)}
.dev.phone .screen{aspect-ratio:390/844;border-radius:36px}
@media (max-width:860px){.dev.phone{width:min(70vw,var(--pw,260px))}}
.dfeed{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.dfeed .fp{width:240px;height:450px;padding:9px;border-radius:44px;background:var(--ink);box-shadow:0 6px 0 var(--ink-edge),0 30px 50px -24px rgba(43,42,76,.55)}
.dfeed .fp .in{height:100%;border-radius:36px;overflow:hidden;background:#15142B}
.dfeed .fp .tk{display:grid;gap:8px;padding:8px;animation:feed 16s linear infinite}
.dfeed .fp .t{height:122px;border-radius:18px}
.legend{display:grid;gap:10px;min-width:260px}
.legend div{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:var(--pressed);font-weight:800}
.legend i{width:32px;height:22px;border-radius:7px;flex:none}
.dstat{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;width:100%;max-width:880px}
@media (max-width:700px){.dstat{grid-template-columns:minmax(0,1fr)}}
.dstat .b{background:#fff;border-radius:24px;box-shadow:var(--pressed);padding:24px 26px;display:grid;gap:14px}
.dstat .b strong{font:700 clamp(84px,10vw,140px)/.9 var(--f-round);color:var(--m-ink);letter-spacing:-.04em}
.dstat .meter{height:16px;border-radius:999px;background:var(--sunken);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.dstat .meter i{display:block;height:100%;width:0;border-radius:inherit;background:var(--m) linear-gradient(90deg,rgba(255,255,255,.3) 0 50%,transparent 50%) 0 0/16px 100%;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.dstat .col{display:grid;gap:16px}
.dstat .s{background:#fff;border-radius:24px;box-shadow:var(--pressed);padding:20px 22px}
.dstat .s strong{display:block;font:700 44px/1 var(--f-round)}
.dstat .s span{font-weight:700;color:var(--ink-2);font-size:14px}
.todo{width:100%;max-width:640px;background:#fff;border-radius:24px;box-shadow:var(--pressed);padding:10px}
.todo .h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 12px;font:600 18px var(--f-round)}
.todo .h span{font:800 13px var(--f-body);color:var(--m-ink);background:var(--m-soft);padding:5px 11px;border-radius:999px}
.todo ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.todo li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;background:var(--sunken);font-weight:700;transition:background .3s}
.todo li .ck{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-strong);display:grid;place-items:center;flex:none;transition:all .3s var(--spring)}
.todo li .ck svg{width:14px;height:14px;opacity:0;transform:scale(.3);transition:all .3s var(--spring)}
.todo li.done{background:var(--m-soft)}
.todo li.done .ck{background:var(--m);box-shadow:0 2px 0 var(--m-edge)}
.todo li.done .ck svg{opacity:1;transform:scale(1)}
.todo li.done .tx{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--m);color:var(--ink-2)}
.todo li.now{background:#FFF6C9}
.todo li.now .ck{box-shadow:inset 0 0 0 2.5px var(--lemon-edge)}

/* fullscreen demo */
.fs[hidden]{display:none}
.fs{position:fixed;inset:0;z-index:95;background:rgba(43,42,76,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;grid-template-rows:auto minmax(0,1fr);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fs .fb{display:flex;gap:10px;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.fs .fb .t{margin-right:auto;font:600 20px var(--f-round);color:#fff}
.fs .st{display:flex;justify-content:center;align-items:stretch;padding:4px 16px 18px;min-height:0}
.fs .fr{width:100%;height:100%;border-radius:22px;overflow:hidden;background:#fff}
.fs .fr.ph{width:410px;max-width:100%;max-height:864px;align-self:center;border-radius:48px;border:10px solid var(--ink)}
.fs iframe{display:block;width:100%;height:100%;border:0}

/* why + flow */
.d-why{padding:clamp(28px,4vw,48px) clamp(22px,4vw,52px) 0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:28px}
@media (max-width:860px){.d-why{grid-template-columns:minmax(0,1fr)}}
.d-why h3,.d-body h3{font:800 12px/1 var(--f-body);letter-spacing:.08em;color:var(--ink-3);margin-bottom:14px}
.d-why .q p{font:700 clamp(17px,1.5vw,19px)/1.75 var(--f-body);color:var(--ink);padding-left:16px;border-left:4px solid var(--m)}
.flowbox{background:#fff;border-radius:24px;box-shadow:var(--pressed);padding:20px 22px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow li{position:relative;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;background:var(--m-soft);font:800 14px/1.35 var(--f-body);animation:pop .5s var(--spring) both;animation-delay:var(--d)}
.flow li b{width:22px;height:22px;border-radius:7px;background:var(--m);color:var(--m-on);display:grid;place-items:center;font:600 12px var(--f-round);flex:none}
.flow li{max-width:100%}.flow li>span{min-width:0}
.flow li small{display:block;font-weight:700;font-size:12px;color:var(--m-ink)}
@keyframes pop{from{transform:translateY(10px) scale(.92);opacity:0}}
.flowbox .fn{margin-top:14px;font:700 14px/1.65 var(--f-body);color:var(--ink-2)}
/* story */
.d-story{padding:clamp(28px,4vw,48px) clamp(22px,4vw,52px) 0;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(26px,3.4vw,40px)}
.d-story h3{font:800 12px/1 var(--f-body);letter-spacing:.08em;color:var(--ink-3);margin-bottom:14px}
.pains{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.pain{background:#fff;border-radius:20px;box-shadow:inset 0 0 0 1.5px var(--line);padding:16px 18px}
.pain .who{display:inline-block;font:800 11.5px/1 var(--f-body);color:var(--m-ink);background:var(--m-soft);padding:5px 9px;border-radius:999px;margin-bottom:10px}
.pain b{display:block;font:800 16px/1.4 var(--f-body);margin-bottom:4px}
.pain p{margin:0;font:600 14px/1.65 var(--f-body);color:var(--ink-2)}
.hard{display:grid;gap:10px}
.hard>div{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:18px;align-items:start;background:#fff;border-radius:20px;box-shadow:inset 0 0 0 1.5px var(--line);padding:16px 18px}
@media (max-width:700px){.hard>div{grid-template-columns:minmax(0,1fr);gap:6px}}
.hard .pb{display:flex;gap:10px;align-items:flex-start;font:800 16px/1.45 var(--f-body)}
.hard .pb i{width:10px;height:10px;border-radius:50%;background:var(--m);flex:none;margin-top:7px;box-shadow:0 0 0 4px var(--m-soft)}
.hard .sv{font:600 14.5px/1.7 var(--f-body);color:var(--ink-2)}
.wfbox{background:var(--m-soft);border-radius:24px;padding:20px 22px}
.wf{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:w}
.wf li{position:relative;background:#fff;border-radius:16px;padding:12px 14px;font:800 14.5px/1.4 var(--f-body);box-shadow:0 3px 0 rgba(43,42,76,.07)}
.wf li::before{counter-increment:w;content:counter(w);display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--m);color:var(--m-on);font:600 12px var(--f-round);margin-bottom:8px}
.wf li small{display:block;font-weight:700;font-size:12.5px;color:var(--ink-3);margin-top:3px}
.wfbox .fn{margin:14px 0 0;font:700 14px/1.65 var(--f-body);color:var(--m-ink)}
.mg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.mg{grid-template-columns:minmax(0,1fr)}}
.mg>div{background:#fff;border-radius:24px;box-shadow:var(--pressed);padding:20px 22px}
.mg ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mg li{position:relative;padding-left:20px;font:700 14.5px/1.65 var(--f-body)}
.mg li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:3px;background:var(--m)}
.mg li em{font-style:normal;color:var(--ink-3)}

  const setM=(el,m)=>{ el.style.setProperty('--m',m[0]); el.style.setProperty('--m-soft',m[1]); el.style.setProperty('--m-ink',m[2]); el.style.setProperty('--m-edge',m[3]); el.style.setProperty('--m-on',m[4]||'#fff'); };

  /* cards */
  const grid=document.getElementById('grid');
  const coverCls={algo:'c-algo',tt:'c-tt',orchard:'c-or',pku:'c-pku',research:'c-res',chat:'c-cm'};
  P.forEach((p,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='card'; b.id='card-'+p.id; setM(b,p.m);
    b.innerHTML=`<div class="cover ${coverCls[p.k]}" aria-hidden="true">${p.cover}</div>
      <div class="body"><div class="row"><span class="ic">${IC[p.k]}</span><div><span class="no">${p.no} · ${p.sub}</span><h3>${p.name}</h3></div></div>
      <p>${p.one}</p><div class="more">${p.live?'<span class="chip live"><i></i>可交互演示</span>':'<span class="chip">'+p.chips[0]+'</span>'}<span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div></div>`;
    b.addEventListener('click',()=>open(i,b));
    grid.appendChild(b);
  });

  /* detail sheet */
  const ov=document.getElementById('ov'), sheet=document.getElementById('sheet'), scroll=document.getElementById('scroll'), dTitle=document.getElementById('dTitle');
  let cur=-1, lastCard=null, timers=[];
  function scale(dv){ const s=dv.querySelector('.screen'), f=s.querySelector('iframe'); if(f) f.style.transform=`scale(${s.clientWidth/(+dv.dataset.w)})`; }
  const storyHTML=(s)=>`<section class="d-story">
      <div><h3>用户痛点</h3><div class="pains">${s.pains.map(x=>`<div class="pain"><span class="who">${x[0]}</span><b>${x[1]}</b><p>${x[2]}</p></div>`).join('')}</div></div>
      <div><h3>技术难点与解决方案</h3><div class="hard">${s.hard.map(x=>`<div><span class="pb"><i></i>${x[0]}</span><span class="sv">${x[1]}</span></div>`).join('')}</div></div>
      ${s.wf?`<div><h3>${s.wf.t}</h3><div class="wfbox"><ol class="wf">${s.wf.steps.map(x=>`<li>${x}</li>`).join('')}</ol><p class="fn">${s.wf.note}</p></div></div>`:''}
      <div class="mg"><div><h3>能力迁移</h3><ul>${s.move.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h3>项目收获</h3><ul>${s.gain.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
    </section>`;
  function render(i){
    timers.forEach(clearInterval); timers=[];
    const p=P[i]; cur=i; setM(sheet,p.m);
    dTitle.innerHTML=`<span class="ic">${IC[p.k]}</span>${p.name}`;
    const prev=P[(i+P.length-1)%P.length], next=P[(i+1)%P.length];
    scroll.innerHTML=`
      <section class="d-hero"><div class="no">${p.no} · ${p.sub}</div><h2>${p.name}</h2><p class="lead">${p.lead}</p>
        <div class="chips">${p.chips.map(c=>`<span class="chip">${c}</span>`).join('')}${p.live?'<span class="chip live"><i></i>支持在线交互</span>':''}</div></section>
      <section class="d-demo">${p.demo}<div class="acts">${p.acts||''}${p.full?`<button class="btn m sm" type="button" data-full>${FS_ICON}全屏体验</button>`:''}</div></section>
      <section class="d-why"><div class="q"><h3>项目背景</h3><p>${p.why}</p></div>
        <div class="flowbox"><h3>关键设计</h3><ol class="flow">${p.flow.map((f,k)=>`<li style="--d:${k*90}ms"><b>${k+1}</b><span>${f}</span></li>`).join('')}</ol><p class="fn">${p.flowNote}</p></div></section>
      ${p.story?storyHTML(p.story):''}
      <section class="d-body"><div><h3>主要工作</h3><ol class="did">${p.did.map((d,k)=>`<li><b>${k+1}</b><span>${d}</span></li>`).join('')}</ol></div>
        <dl class="facts"><h3 style="margin-bottom:4px">项目信息</h3>${p.facts.map(f=>`<div><dt>${f[0]}</dt><dd>${f[1]}</dd></div>`).join('')}</dl></section>
      <div class="nextbar"><button type="button" data-go="${(i+P.length-1)%P.length}"><small>← 上一个</small><b>${prev.name}</b></button><button class="r" type="button" data-go="${(i+1)%P.length}"><small>下一个 →</small><b>${next.name}</b></button></div>`;
    scroll.scrollTop=0;
    // live screens
    scroll.querySelectorAll('.dev[data-src]').forEach(dv=>{
      if(small()) return;
      const s=dv.querySelector('.screen'), f=document.createElement('iframe');
      f.src=dv.dataset.src; f.title=dv.dataset.title; f.style.width=dv.dataset.w+'px'; f.style.height=dv.dataset.h+'px';
      f.addEventListener('load',()=>setTimeout(()=>s.classList.add('loaded'),250)); s.appendChild(f);
      new ResizeObserver(()=>scale(dv)).observe(s); scale(dv);
    });
    if(small()) scroll.querySelectorAll('.dev[data-src]').forEach(dv=>{ dv.style.cursor='pointer'; dv.addEventListener('click',()=>openFs(dv.dataset.src,dv.dataset.title,true,dv)); });
    scroll.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{ render(+b.dataset.go); try{ history.replaceState(null,'','#'+P[cur].id); }catch(e){} }));
    const fb=scroll.querySelector('[data-full]'); if(fb) fb.addEventListener('click',()=>openFs(p.full[0],p.full[1],!!p.full[2]||small(),fb));
    // pku counter
    const cn=scroll.querySelector('[data-count]'), mt=scroll.querySelector('[data-meter]');
    if(cn){ requestAnimationFrame(()=>mt.style.width='100%'); if(!reduce){ const t0=performance.now(); (function s(t){ const q=Math.min(1,(t-t0)/1300); cn.textContent=Math.round(100*(1-Math.pow(1-q,3))); if(q<1&&cur===i) requestAnimationFrame(s); })(t0); } }
    // todo
    const ol=scroll.querySelector('[data-todo]');
    if(ol){ const steps=['输入视频链接','自动下载视频','Whisper 并发转写','GPT 定性编码','写入 Google Sheets','研究者复核'];
      ol.innerHTML=steps.map(s=>`<li><span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="tx">${s}</span></li>`).join('');
      const items=[...ol.children], cnt=scroll.querySelector('[data-todo-count]'); let k=0;
      const tick=()=>{ items.forEach((li,j)=>{ li.classList.toggle('done',j<k); li.classList.toggle('now',j===k); }); cnt.textContent=Math.min(k,6)+' / 6'; k=k>7?0:k+1; };
      if(reduce){ k=6; tick(); } else { tick(); timers.push(setInterval(tick,850)); } }
  }
  function open(i,card){
    lastCard=card||document.getElementById('card-'+P[i].id);
    render(i); ov.hidden=false; document.body.classList.add('lock');
    try{ history.replaceState(null,'','#'+P[i].id); }catch(e){}
    if(!reduce&&lastCard){
      const a=lastCard.getBoundingClientRect(), b=sheet.getBoundingClientRect();
      sheet.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${a.width/b.width},${a.height/b.height})`,borderRadius:'60px',opacity:.6},{transform:'none',borderRadius:getComputedStyle(sheet).borderRadius,opacity:1}],{duration:480,easing:'cubic-bezier(.2,.9,.25,1)'});
      ov.querySelector('.scrim').animate([{opacity:0},{opacity:1}],{duration:300});
      scroll.animate([{opacity:0},{opacity:0,offset:.4},{opacity:1}],{duration:480});
    }
    document.getElementById('close').focus();
  }
  function close(){
    timers.forEach(clearInterval); timers=[];
    const done=()=>{ ov.hidden=true; scroll.innerHTML=''; document.body.classList.remove('lock'); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} if(lastCard) lastCard.focus(); };
    const card=document.getElementById('card-'+P[cur].id);
    if(reduce||!card) return done();
    const a=card.getBoundingClientRect(), b=sheet.getBoundingClientRect();
    scroll.animate([{opacity:1},{opacity:0}],{duration:150,fill:'forwards'});
    ov.querySelector('.scrim').animate([{opacity:1},{opacity:0}],{duration:360,fill:'forwards'});
    sheet.animate([{transform:'none',opacity:1},{transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${a.width/b.width},${a.height/b.height})`,borderRadius:'60px',opacity:.4}],{duration:380,easing:'cubic-bezier(.5,0,.75,0)'}).onfinish=()=>{ done(); sheet.getAnimations().forEach(x=>x.cancel()); scroll.getAnimations().forEach(x=>x.cancel()); ov.querySelector('.scrim').getAnimations().forEach(x=>x.cancel()); };
  }
  document.getElementById('close').addEventListener('click',close);
  document.getElementById('scrim').addEventListener('click',close);
  document.getElementById('prev').addEventListener('click',()=>{ render((cur+P.length-1)%P.length); try{ history.replaceState(null,'','#'+P[cur].id); }catch(e){} });
  document.getElementById('next').addEventListener('click',()=>{ render((cur+1)%P.length); try{ history.replaceState(null,'','#'+P[cur].id); }catch(e){} });
  addEventListener('keydown',e=>{
    if(!document.getElementById('fs').hidden){ if(e.key==='Escape') closeFs(); return; }
    if(e.target.closest&&e.target.closest('input,textarea')) return;
    if(ov.hidden){ const n=parseInt(e.key,10); if(n>=1&&n<=P.length) open(n-1); return; }
    if(e.key==='Escape') close();
    if(e.key==='ArrowRight') document.getElementById('next').click();
    if(e.key==='ArrowLeft') document.getElementById('prev').click();
  });
  const h=location.hash.slice(1), hi=P.findIndex(p=>p.id===h); if(hi>=0) open(hi);

  /* fullscreen demo */
  const fs=document.getElementById('fs'), fsSt=document.getElementById('fsSt'), fsT=document.getElementById('fsT'), fsDev=document.getElementById('fsDev');
  let fr=null, fsLast=null;
  function openFs(src,title,ph,btn){ fsLast=btn; fsSt.innerHTML=''; fr=document.createElement('div'); fr.className='fr'+(ph?' ph':''); const f=document.createElement('iframe'); f.src=src; f.title=title; fr.appendChild(f); fsSt.appendChild(fr);
    fsT.textContent=title; fsDev.textContent=ph?'电脑尺寸':'手机尺寸'; fs.hidden=false; document.getElementById('fsClose').focus(); }
  function closeFs(){ fs.hidden=true; fsSt.innerHTML=''; fr=null; if(fsLast) fsLast.focus(); }
  fsDev.addEventListener('click',()=>{ if(!fr) return; const ph=fr.classList.toggle('ph'); fsDev.textContent=ph?'电脑尺寸':'手机尺寸'; });
  document.getElementById('fsClose').addEventListener('click',closeFs);

})();
</script>
