<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>找语伴 · 深色</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#14122B}
a{color:#F4F2FF;text-decoration:none}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14122B; position: relative; overflow: hidden; font-family: 'Nunito', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif; color: #F4F2FF; display: flex; flex-direction: column; gap: 14px; padding: 54px 16px 34px;">

  <div style="display: flex; align-items: center; gap: 10px; height: 52px;">
    <a href="CommunityDark.dc.html" aria-label="返回" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; margin-left: -4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column;">
      <div style="font-family: 'Fredoka', 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 600; line-height: 1.1;">找语伴</div>
      <div style="font-size: 12px; font-weight: 700; color: #ABA7CC;">今天为你挑了 3 位 · {{ pos }}</div>
    </div>
    <button aria-label="筛选" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #211E3D; color: #F4F2FF; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>

  <div style="background: #211E3D; border-radius: 22px; padding: 10px 12px; display: flex; align-items: center; gap: 8px;">
    <span style="font-size: 13px; font-weight: 700; color: #ABA7CC;">我说</span>
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #5ED3A8; color: #1E1B3A; display: flex; align-items: center; font-size: 14px; font-weight: 800;">中文</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ABA7CC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13l-3-3M17 17H4l3 3"/></svg>
    <span style="font-size: 13px; font-weight: 700; color: #ABA7CC;">想练</span>
    <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #B3A6FF; color: #1E1B3A; display: flex; align-items: center; font-size: 14px; font-weight: 800;">English</span>
    <button style="margin-left: auto; height: 32px; padding: 0 4px; border: 0; background: transparent; font-family: inherit; font-size: 13px; font-weight: 800; color: #B3A6FF;">修改</button>
  </div>

  <div style="position: relative; height: 392px;">
    <div style="position: absolute; inset: 14px 18px -10px; border-radius: 30px; background: #3A3270; transform: rotate(3deg);" aria-hidden="true"></div>
    <div style="position: absolute; inset: 8px 10px -4px; border-radius: 30px; background: #1F4A43; transform: rotate(-2.5deg);" aria-hidden="true"></div>
    <div style="position: absolute; inset: 0; border-radius: 30px; background: #211E3D; border: 1.5px solid #38345E; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 14px 34px rgba(0,0,0,0.45);">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="width: 72px; height: 72px; border-radius: 36px; background: {{ c.color }}; color: #1E1B3A; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-size: 32px; font-weight: 600; flex: 0 0 auto; position: relative;">
          {{ c.initial }}
          <span style="position: absolute; right: 2px; bottom: 2px; width: 16px; height: 16px; border-radius: 8px; background: #4CD08F; box-shadow: 0 0 0 3px #211E3D;" aria-label="在线"></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <div style="font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 600; line-height: 1.1;">{{ c.name }}</div>
          <div style="font-size: 13px; font-weight: 700; color: #ABA7CC;">{{ c.city }} · 在线</div>
        </div>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: #B3A6FF; color: #1E1B3A; display: flex; align-items: center; font-size: 13px; font-weight: 800;">母语 {{ c.native }}</span>
        <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: #5ED3A8; color: #1E1B3A; display: flex; align-items: center; font-size: 13px; font-weight: 800;">在学 {{ c.learning }}</span>
      </div>
      <div style="background: #2C2850; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 15px; line-height: 1.5; font-weight: 700;">{{ c.intro }}</div>
        <div style="font-size: 14px; line-height: 1.5; font-weight: 600; color: #ABA7CC;">{{ c.introZh }}</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; font-weight: 800; color: #ABA7CC;">你们都喜欢</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <sc-for list="{{ c.common }}" as="cm" hint-placeholder-count="3">
            <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,200,69,0.16); display: flex; align-items: center; font-size: 13px; font-weight: 800; color: #FFD97A;">{{ cm.t }}</span>
          </sc-for>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 4px;">
    <button onClick="{{ skip }}" aria-label="跳过" style="width: 60px; height: 60px; border-radius: 30px; border: 0; background: #211E3D; color: #F4F2FF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #0A0918;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <a href="PeerChatDark.dc.html" style="flex: 1; height: 60px; border-radius: 30px; background: #FFE27A; color: #1E1B3A; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 800; box-shadow: 0 5px 0 #B89A3A;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      打个招呼
    </a>
  </div>

  <a href="PeerChatDark.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 24px; background: #211E3D; border: 1.5px solid #38345E;">
    <div style="width: 44px; height: 44px; border-radius: 15px; background: #5ED3A8; color: #1E1B3A; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20l17-17M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 15px; font-weight: 800;">随机配一位，聊 10 分钟</div>
      <div style="font-size: 12px; font-weight: 600; color: #ABA7CC;">双方都说母语，AI 实时翻给对方</div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 2 };
  }
  renderVals() {
    const C = [
      { name: 'Emma Lee', city: '西雅图', initial: 'E', color: '#FFD6C8', native: 'English', learning: '中文 · 入门',
        intro: "I'm learning Chinese before my trip to Chengdu next spring. Happy to help you with English!",
        introZh: '我在为明年春天去成都学中文，很乐意帮你练英语！', common: ['散步', '咖啡', '做饭'] },
      { name: 'Lucas', city: '马德里', initial: 'L', color: '#C8F1E0', native: 'Español', learning: '中文 · 进阶',
        intro: 'Vivo en Madrid y practico chino para mi trabajo. ¡Me encanta el fútbol!',
        introZh: '我住在马德里，为了工作在练中文。超爱足球！', common: ['电影', '旅行'] },
      { name: 'Yuki', city: '东京', initial: 'Y', color: '#DDD7FF', native: '日本語', learning: 'English · 中级',
        intro: '英語と中国語を勉強中です。週末はよくカフェで本を読んでいます。',
        introZh: '我在学英语和中文，周末常在咖啡馆看书。', common: ['咖啡', '阅读'] }
    ];
    const c = C[this.state.idx];
    return {
      c: Object.assign({}, c, { common: c.common.map((t) => ({ t: t })) }),
      pos: (this.state.idx + 1) + ' / 3',
      skip: () => this.setState({ idx: (this.state.idx + 1) % C.length })
    };
  }
}
</script>
</body>
</html>
